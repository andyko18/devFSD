  <g>
    <circle class="dot" cx="60" cy="128" r="7"/><circle class="lanef d0" cx="60" cy="128" r="7"/>
    <text class="ink" x="60" y="154" text-anchor="middle" font-size="15">출발</text>
    <text class="mut c0" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">출발</tspan>  —  만들고 싶은 것을 한 줄로 입력한다</text>
    <circle class="dot" cx="152" cy="128" r="7"/><circle class="lanef d1" cx="152" cy="128" r="7"/>
    <text class="ink" x="152" y="176" text-anchor="middle" font-size="15">명세</text>
    <text class="mut c1" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">명세</tspan>  —  무엇을 만들지와 완료 기준을 문서로 정리한다</text>
    <circle class="dot" cx="244" cy="128" r="7"/><circle class="lanef d2" cx="244" cy="128" r="7"/>
    <text class="ink" x="244" y="154" text-anchor="middle" font-size="15">명확화</text>
    <text class="mut c2" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">명확화</tspan>  —  애매한 점을 묶어서 묻는다 (최대 2번)</text>
    <rect class="stopc b3" x="361" y="67" width="8" height="50" rx="3"/>
    <text class="stopc h3" x="365" y="54" text-anchor="middle" font-size="13" font-weight="600">사람이 확인</text>
    <circle class="dot" cx="336" cy="128" r="7"/><circle class="lanef d3" cx="336" cy="128" r="7"/>
    <text class="ink" x="336" y="176" text-anchor="middle" font-size="15">승인</text>
    <text class="mut c3" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">승인</tspan>  —  사람이 설계 전체를 한 번에 보고 승인한다</text>
    <circle class="dot" cx="428" cy="128" r="7"/><circle class="lanef d4" cx="428" cy="128" r="7"/>
    <text class="ink" x="428" y="154" text-anchor="middle" font-size="15">계획</text>
    <text class="mut c4" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">계획</tspan>  —  구현 방법을 짜고 분야 전문가가 한 번 더 본다</text>
    <circle class="dot" cx="520" cy="128" r="7"/><circle class="lanef d5" cx="520" cy="128" r="7"/>
    <text class="ink" x="520" y="176" text-anchor="middle" font-size="15">분해</text>
    <text class="mut c5" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">분해</tspan>  —  일을 작은 작업 단위로 나눈다</text>
    <circle class="dot" cx="612" cy="128" r="7"/><circle class="lanef d6" cx="612" cy="128" r="7"/>
    <text class="ink" x="612" y="154" text-anchor="middle" font-size="15">구현</text>
    <text class="mut c6" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">구현</tspan>  —  테스트를 먼저 쓰고 코드를 만든 뒤 리뷰한다</text>
    <circle class="dot" cx="704" cy="128" r="7"/><circle class="lanef d7" cx="704" cy="128" r="7"/>
    <text class="ink" x="704" y="176" text-anchor="middle" font-size="15">검증</text>
    <text class="mut c7" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">검증</tspan>  —  테스트를 실제로 돌려 통과 기록을 남긴다</text>
    <circle class="dot" cx="796" cy="128" r="7"/><circle class="lanef d8" cx="796" cy="128" r="7"/>
    <text class="ink" x="796" y="154" text-anchor="middle" font-size="15">보안·통합·성능</text>
    <text class="mut c8" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">보안·통합·성능</tspan>  —  해당하는 변경일 때만 점검한다</text>
    <circle class="dot" cx="888" cy="128" r="7"/><circle class="lanef d9" cx="888" cy="128" r="7"/>
    <text class="ink" x="888" y="176" text-anchor="middle" font-size="15">PR</text>
    <text class="mut c9" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">PR</tspan>  —  만든 결과를 보여 주고 PR 을 만든다</text>
    <rect class="stopc b10" x="1005" y="67" width="8" height="50" rx="3"/>
    <text class="stopc h10" x="1030" y="54" text-anchor="end" font-size="13" font-weight="600">사람이 확인</text>
    <circle class="dot" cx="980" cy="128" r="7"/><circle class="lanef d10" cx="980" cy="128" r="7"/>
    <text class="ink" x="980" y="154" text-anchor="middle" font-size="15">머지</text>
    <text class="mut c10" x="520" y="232" text-anchor="middle" font-size="16"><tspan class="sign" font-weight="700">머지</tspan>  —  사람이 PR 을 확인하고 병합한다</text>
  </g>
