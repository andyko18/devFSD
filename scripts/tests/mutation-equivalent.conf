# 알려진 equivalent mutant (분모 제외). return-code/관찰불가 변형만 — 근거 없는 등재는 자기발급 면제표다.
# 행 형식 (TAB 구분 5칸): <target> <함수[#k/n]> <pattern> <줄 원문> <reason>
#   · 키는 줄번호가 아니라 **함수 + 줄 원문**이다(정확 일치 · 앞뒤 공백 제거 · 연속 공백 1칸). 함수 밖 줄은 함수 칸이 `-`.
#     공백 정규화는 문자열 리터럴 안에도 적용된다 — 메시지 속 연속 공백만 바뀐 줄은 같은 줄로 본다.
#   · target 칸은 mutation-targets.conf 의 표기와 글자 그대로 같아야 한다(`./x`·절대경로·오타는 --check-conf 가 거부한다).
#   · `#k/n`: 같은 (함수·pattern·원문) 줄이 n개일 때 위에서 k번째. 같은 원문의 줄이 그 함수 안에 늘거나 줄면 STALE 이다.
#   · 행은 손으로 짓지 않는다: `bash scripts/tests/mutation-score.sh --anchor <target> <line> <pattern> >> 이 파일`
#     로 붙이고 끝에 reason 을 쓴다(reason 이 비면 --check-conf 가 거부한다). 칸 구분은 TAB 이다 — 터미널에서 복사하면
#     공백으로 바뀌어 형식 오류가 난다.
#   · pattern 칸 필수 — 한 줄에 'return 0' 과 '&&' 두 변형이 있으면 근거가 선 쪽만 등재한다(나머지는 행동 기반 killed 유지).
#   · 정합 확인: `mutation-score.sh --check-conf` (1초 · run-all 의 test-mutation-conf-fresh 가 상시 실행한다).
# governance-lib 1차 등재분: caller 가 result=$(func ... || true) 로 stdout만 캡처·종료코드 무시 → return 0 변형 무관찰(equivalent)
#
# ★ 20261010 키 전환(20261010-mutation-equiv-anchors): 종전 키는 **절대 줄번호**였다. 대상 파일이 자랄 때마다 줄번호를
#   다시 맞췄고(이 파일에 기록된 것만 6회), 더 나쁜 것은 **무음 오매칭**이었다 — 줄이 밀린 자리에 마침 다른 `return 0` 이
#   오면 --check-conf 가 통과한 채 **엉뚱한 가드가 등가로 빠졌다**(실측 3건: verification-state 의 WAIVED 만료메타 자리에
#   비정규 verdict 분기가 2번 · governance-lib 의 load_rules 자리에 apply_lookback_rule 이 1번).
#   107행을 --anchor 로 기계 변환했고(reason 은 그대로), 변환 전후로 풀리는 (줄·pattern) 집합이 대상 4종 모두 같다.
# ⚠️ 키가 지키는 것은 "어느 줄인가" 까지다. **그 줄이 여전히 등가인가**는 호출부에 달려 있고, 호출부가 바뀌어도 이 파일은
#   울지 않는다 — 블록마다 적어 둔 호출 형태를 대상 파일을 고칠 때 함께 본다. 근거가 **인접 줄**에 걸린 행도 같다
#   (예: pretool 의 함수 밖 `&&` 행은 "다음 줄 `cd … || true` 가 실패를 흡수" 가 근거인데, 키에는 그 다음 줄이 없다).
#   · 원문이 `return 0` 한 줄뿐인 사이트는 키가 "그 함수의 몇 번째 bare return 인가" 까지만 말한다. 같은 함수 안에서 그런 줄의
#     순서를 바꾸거나, 하나를 지우고 다른 자리에 하나를 넣으면(개수 동일) 잡지 못한다.
#   · 아래 주석과 reason 에 남은 줄번호(L141 · L447 등)는 **작성 시점 값**이다. 찾을 때는 함수명·원문으로 찾는다.
