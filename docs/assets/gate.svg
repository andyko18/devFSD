<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="1040" height="270" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title id="t">안전장치 — 증거가 없으면 커밋이 멈춘다</title>
  <desc id="d">위쪽 차선은 검증 없이 커밋해 빨간 차단기에 막힌다. 아래쪽 차선은 검증 통과 기록이 켜진 뒤 차단기가 올라가 커밋이 저장소까지 간다.</desc>
  <style>
    .bg{fill:#F2F5F8;stroke:#D5DCE4} .ink{fill:#17202B} .mut{fill:#5A6878}
    .sign{fill:#1C5FC4} .signink{fill:#FFFFFF} .stopc{fill:#C8372A} .stops{stroke:#C8372A} .goc{fill:#1E8E5A}
    .road{stroke:#2B3440} .edge{stroke:#1B222B} .lane{stroke:#D98E04} .lanef{fill:#D98E04}
    .dot{fill:#FFFFFF;stroke:#5A6878;stroke-width:2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#10161F;stroke:#2A3645} .ink{fill:#E6ECF3} .mut{fill:#9AA8B8}
      .sign{fill:#6FA8FF} .signink{fill:#0B1420} .stopc{fill:#FF6B5E} .stops{stroke:#FF6B5E} .goc{fill:#4CC38A}
      .road{stroke:#0A0F15} .edge{stroke:#3A4758} .lane{stroke:#F2B63C} .lanef{fill:#F2B63C}
      .dot{fill:#18212D;stroke:#9AA8B8}
    }
    @media (prefers-reduced-motion: reduce){ *{animation:none !important} }

    @keyframes ga{0%,6%{transform:translateX(-330px)}30%,100%{transform:translateX(0px)}}
    @keyframes gabump{0%,30%{transform:translateX(0)}33%{transform:translateX(-8px)}36%{transform:translateX(0)}39%{transform:translateX(-8px)}42%,100%{transform:translateX(0)}}
    @keyframes gamsg{0%,40%{opacity:0}46%,100%{opacity:1}}
    @keyframes gb{0%,6%{transform:translateX(-720px)}26%{transform:translateX(-390px)}48%{transform:translateX(-390px)}74%,100%{transform:translateX(0px)}}
    @keyframes gblamp{0%,26%{opacity:.15}32%,100%{opacity:1}}
    @keyframes gbbar{0%,36%{transform:scaleY(1)}46%,100%{transform:scaleY(.14)}}
    @keyframes gbmsg{0%,74%{opacity:0}80%,100%{opacity:1}}
    .ga{animation:ga 8.0s ease-in-out infinite} .gab{animation:gabump 8.0s linear infinite} .gamsg{animation:gamsg 8.0s linear infinite}
    .gb{animation:gb 8.0s ease-in-out infinite} .gblamp{animation:gblamp 8.0s linear infinite}
    .gbbar{transform-box:fill-box;transform-origin:50% 0%;animation:gbbar 8.0s ease-in-out infinite} .gbmsg{animation:gbmsg 8.0s linear infinite}
</style>
  <rect class="bg" x="1" y="1" width="1038" height="268" rx="12"/>
  <text class="ink" x="40" y="44" font-size="16" font-weight="700">검증 없이 커밋하면</text>
  <rect class="road" x="40" y="56" width="960" height="52" rx="8" fill="#2B3440" stroke="none" style="fill:#2B3440"/>
  <line class="lane" x1="52" y1="82" x2="988" y2="82" stroke-width="3" stroke-dasharray="14 12" opacity=".7"/>
  <rect x="868" y="69" width="112" height="26" rx="5" fill="none" stroke="#9AA8B8" stroke-dasharray="4 3"/><text x="924" y="87" text-anchor="middle" font-size="13" fill="#E6ECF3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">저장소</text>
  <rect class="stopc" x="520" y="58" width="9" height="48" rx="4"/>
  <g class="ga"><g class="gab"><g class=""><rect class="sign" x="404" y="67" width="104" height="28" rx="6"/><text class="signink" x="456" y="86" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">git commit</text></g></g></g>
  <rect class="gamsg" x="540" y="66" width="250" height="30" rx="5" fill="#2B3440"/>
  <text class="stopc gamsg" x="548" y="87" font-size="15" font-weight="700" style="fill:#FF8A7E">차단됨 — 테스트 통과 기록 없음</text>
  <text class="ink" x="40" y="162" font-size="16" font-weight="700">검증하고 커밋하면</text>
  <rect class="road" x="40" y="174" width="960" height="52" rx="8" fill="#2B3440" stroke="none" style="fill:#2B3440"/>
  <line class="lane" x1="52" y1="200" x2="988" y2="200" stroke-width="3" stroke-dasharray="14 12" opacity=".7"/>
  <rect x="868" y="187" width="112" height="26" rx="5" fill="none" stroke="#9AA8B8" stroke-dasharray="4 3"/><text x="924" y="205" text-anchor="middle" font-size="13" fill="#E6ECF3" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">저장소</text>
  <g class="gblamp"><rect class="goc" x="250" y="144" width="126" height="24" rx="12"/><text x="313" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">VERIFY: PASS</text></g>
  <rect class="goc gbbar" x="520" y="176" width="9" height="48" rx="4"/>
  <g class="gb"><rect class="sign" x="756" y="185" width="104" height="28" rx="6"/><text class="signink" x="808" y="204" text-anchor="middle" font-size="13" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">git commit</text></g>
  <text class="gbmsg" x="548" y="246" font-size="15" font-weight="700" style="fill:#1E8E5A">통과 — 기록을 확인하고 커밋을 실행</text>
</svg>
