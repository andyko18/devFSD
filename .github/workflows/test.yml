name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: python3 -m pip install --user 'pyyaml==6.0.2'
      - name: Run full test suite
        run: bash scripts/tests/run-all.sh --quiet
      - name: Governance hook performance gate
        run: BENCH_THRESHOLD_MS=800 BENCH_STOP_THRESHOLD_MS=3000 bash scripts/tests/governance/bench-hook.sh

  # macOS/BSD 경로 검증 (release.sh _sed_i Darwin 분기·bash 3.2 호환).
  # 차단 승격 (20260716 — 테스트영역 감사 P3): 관찰 기간 동안 macOS 러너 green + 로컬(darwin) 이
  # 주 개발 환경이라 실패는 실결함 신호. timing 게이트(bench)는 플랫폼 무관 로직이 아니라 ubuntu 전담.
  run-all-macos:
    runs-on: macos-latest
    # 실측 소요의 2배 이상(llm-smoke.yml 규약) — 20261021 실측 11·13.5·15분, 15분 한도에서 202/202 통과 직후 취소됐다
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: python3 -m pip install --user --break-system-packages 'pyyaml==6.0.2'
      - name: Run full test suite (macOS smoke)
        run: bash scripts/tests/run-all.sh --quiet

  shellcheck:
    runs-on: ubuntu-latest
    # 20261010: 5 → 10. 두 단계가 각각 약 2분 30초라(스크립트·테스트가 늘며 길어졌다) 평소에도 4분 30초였고,
    #   테스트 100줄을 더한 PR 에서 비차단 리포트 단계 도중 상한에 걸려 job 이 취소됐다(차단 단계는 이미 통과한 뒤였다).
    #   취소는 필수 검사를 막는다 — 스크립트를 더할 때 이 값도 다시 본다.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # error severity 게이트 (현재 0건 — footgun 유입 차단). warning 은 점진 개선 대상.
      - name: Lint (error gate)
        run: find hooks scripts -name '*.sh' -print0 | xargs -0 shellcheck -S error
      - name: Warning report (non-blocking)
        run: find hooks scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning || true

  # 보안 스캔 (비차단 관찰 — clarify Q1). 룰이 repo 에서 처음 도는 단계라
  # 오탐이 공통 작업을 막지 않게 리포트만 남긴다. 단 "스캔이 실제로 돌았는가" 는 차단한다.
  # 차단 승격(crit/high → job red)은 1~2 릴리즈 관찰 후 별도 FID.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install semgrep
        run: |
          python3 -m pip install --user 'semgrep==1.172.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # jq 도 같이 본다 — security-scan.sh 는 jq 부재 시 ext_skip=1 로 semgrep 층을 건너뛰어
      # 룰셋 표기가 사라진다. 그러면 아래 게이트가 "미실행" 으로 붉어져 원인이 한 칸 비켜 보인다.
      - name: Verify semgrep on PATH
        run: |
          semgrep --version
          command -v jq
      - name: SAST report (findings non-blocking, non-execution blocking)
        run: |
          fail=0
          for t in hooks scripts; do
            out=$(bash scripts/security-scan.sh "$t" 2>&1) || true
            printf '=== %s\n%s\n' "$t" "$out"
            if ! printf '%s' "$out" | grep -qF '(룰셋: 로컬 bash-injection)'; then
              echo "::error::semgrep 미실행 — 룰셋 표기 부재 ($t)"
              fail=1
            fi
            if printf '%s' "$out" | grep -q 'semgrep('; then
              echo "::error::semgrep 강등 — 스캔이 완주하지 못했다 ($t)"
              fail=1
            fi
          done
          exit "$fail"
