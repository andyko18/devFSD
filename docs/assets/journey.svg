  <rect class="bg" x="1" y="1" width="1038" height="254" rx="12"/>
  <path class="edge" d="M40 92 H1000" stroke-width="50" stroke-linecap="round" fill="none"/>
  <path class="road" d="M40 92 H1000" stroke-width="46" stroke-linecap="round" fill="none"/>
