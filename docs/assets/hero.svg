<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="t d">
  <title id="t">devFSD — 명세에서 PR 까지 이어지는 개발 자율주행</title>
  <desc id="d">명세, 명확화, 계획, 분해, TDD 구현, 검증, 리뷰, 보안·통합·성능, PR 순서로 이어지는 단계 위를 빛나는 점이 달린다. 사람이 확인하는 곳은 명확화 끝의 승인 묶음 1회와 PR 머지다(--step 이면 단계마다).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop class="b0" offset="0"/><stop class="b1" offset="0.55"/><stop class="b2" offset="1"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.35" stop-color="#34d399"/><stop offset="0.7" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop class="t0" offset="0"/><stop class="t1" offset="0.5"/><stop class="t2" offset="1"/></linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fb7185" stop-opacity="0.4"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="card"><rect x="2" y="2" width="1276" height="456" rx="28"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="grid" d="M40 0H0V40" fill="none" stroke-width="1"/></pattern>
  </defs>
  <style>
    text{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif}
    .b0{stop-color:#f8fbff}.b1{stop-color:#eef2ff}.b2{stop-color:#fdf2f8}
    .t0{stop-color:#0284c7}.t1{stop-color:#7c3aed}.t2{stop-color:#e11d48}
    .frame{stroke:#dbe3f3}
    .grid{stroke:#c7d2fe;stroke-opacity:.35}
    .blob{opacity:.55}
    .pill{fill:#ffffff;stroke:#c7d2fe}.pillt{fill:#4338ca}
    .tag{fill:#1e293b}.sub{fill:#475569}
    .node{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
    .gate{fill:#ffffff;stroke:#7c3aed;stroke-width:3}
    .lbl{fill:#1e293b}.gl{fill:#5b21b6;font-weight:700}
    .roadbase{stroke:#cbd5e1}
    .chip{fill:#ffffff;fill-opacity:.85;stroke:#dbe3f3}.chipt{fill:#334155}.chipk{fill:#0f172a;font-weight:700}
    .dash{stroke-dasharray:14 14;animation:run 1.6s linear infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .float{animation:float 9s ease-in-out infinite}
    @keyframes run{to{stroke-dashoffset:-28}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @media (prefers-color-scheme: dark){
      .b0{stop-color:#070b1a}.b1{stop-color:#0d1430}.b2{stop-color:#1a0f2e}
      .t0{stop-color:#7dd3fc}.t1{stop-color:#c4b5fd}.t2{stop-color:#fda4af}
      .frame{stroke:#27325a}
      .grid{stroke:#6366f1;stroke-opacity:.16}
      .blob{opacity:.9}
      .pill{fill:#111a3a;stroke:#3b4a86}.pillt{fill:#c7d2fe}
      .tag{fill:#f1f5f9}.sub{fill:#a5b4cf}
      .node{fill:#0f1733;stroke:#475a8f}
      .gate{fill:#161040;stroke:#c4b5fd}
      .lbl{fill:#e2e8f0}.gl{fill:#ddd6fe}
      .roadbase{stroke:#27325a}
      .chip{fill:#0f1733;fill-opacity:.8;stroke:#27325a}.chipt{fill:#a5b4cf}.chipk{fill:#f8fafc}
    }
    @media (prefers-reduced-motion: reduce){.dash,.pulse,.float{animation:none}.car{display:none}}
  </style>

  <g clip-path="url(#card)">
    <rect x="2" y="2" width="1276" height="456" fill="url(#bg)"/>
    <rect x="2" y="2" width="1276" height="456" fill="url(#grid)"/>
    <g class="blob">
      <circle class="float" cx="150" cy="70" r="230" fill="url(#blobA)"/>
      <circle class="float" cx="1130" cy="120" r="260" fill="url(#blobB)" style="animation-delay:-3s"/>
      <circle class="float" cx="700" cy="470" r="240" fill="url(#blobC)" style="animation-delay:-6s"/>
    </g>
    <rect x="2" y="2" width="1276" height="7" fill="url(#road)"/>
  </g>
  <rect class="frame" x="2" y="2" width="1276" height="456" rx="28" fill="none" stroke-width="2"/>

  <rect class="pill" x="478" y="38" width="324" height="34" rx="17" stroke-width="1.5"/>
  <circle class="pulse" cx="500" cy="55" r="5" fill="#34d399"/>
  <text class="pillt" x="648" y="61" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">CLAUDE CODE 전용 · 한국어 Lifecycle</text>

  <text x="640" y="158" font-size="96" font-weight="800" text-anchor="middle" fill="url(#title)" letter-spacing="-2">devFSD</text>
  <text class="tag" x="640" y="204" font-size="27" font-weight="700" text-anchor="middle">개발 자율주행 — 한마디 요청이 PR 까지 스스로 달린다</text>
  <text class="sub" x="640" y="236" font-size="18" text-anchor="middle">감독형이다 · 설계 승인과 PR 머지는 사람이 한다</text>

  <path class="roadbase" d="M104 316H1176" fill="none" stroke-width="10" stroke-linecap="round"/>
  <path d="M104 316H1176" fill="none" stroke="url(#road)" stroke-width="10" stroke-linecap="round" opacity=".28" filter="url(#soft)"/>
  <path class="dash" d="M104 316H1176" fill="none" stroke="url(#road)" stroke-width="4" stroke-linecap="round"/>

  <g class="car" filter="url(#glow)">
    <circle r="9" fill="#ffffff"><animateMotion dur="7s" repeatCount="indefinite" path="M104 316H1176" keyTimes="0;1" calcMode="linear"/></circle>
    <circle r="15" fill="#7dd3fc" opacity=".45"><animateMotion dur="7s" repeatCount="indefinite" path="M104 316H1176" keyTimes="0;1" calcMode="linear"/></circle>
  </g>

  <g font-size="16" text-anchor="middle">
    <circle class="node" cx="104" cy="316" r="13"/><circle cx="104" cy="316" r="5" fill="#38bdf8"/>
    <text class="lbl" x="104" y="356">명세</text>

    <circle class="gate" cx="238" cy="316" r="17" filter="url(#glow)"/><text class="gl" x="238" y="322" font-size="17">★</text>
    <text class="gl" x="238" y="356">명확화 · 승인</text>

    <circle class="node" cx="372" cy="316" r="13"/><circle cx="372" cy="316" r="5" fill="#38bdf8"/>
    <text class="lbl" x="372" y="356">계획</text>

    <circle class="node" cx="506" cy="316" r="13"/><circle cx="506" cy="316" r="5" fill="#34d399"/>
    <text class="lbl" x="506" y="356">분해</text>

    <circle class="node" cx="640" cy="316" r="13"/><circle cx="640" cy="316" r="5" fill="#34d399"/>
    <text class="lbl" x="640" y="356">TDD 구현</text>

    <circle class="node" cx="774" cy="316" r="13"/><circle cx="774" cy="316" r="5" fill="#fbbf24"/>
    <text class="lbl" x="774" y="356">검증</text>

    <circle class="node" cx="908" cy="316" r="13"/><circle cx="908" cy="316" r="5" fill="#fbbf24"/>
    <text class="lbl" x="908" y="356">리뷰</text>

    <circle class="node" cx="1042" cy="316" r="13"/><circle cx="1042" cy="316" r="5" fill="#fb7185"/>
    <text class="lbl" x="1042" y="356">보안·통합·성능</text>

    <circle class="gate" cx="1176" cy="316" r="17" filter="url(#glow)"/><text class="gl" x="1176" y="322" font-size="17">★</text>
    <text class="gl" x="1176" y="356">PR · 머지</text>
  </g>

  <g font-size="15" text-anchor="middle">
    <rect class="chip" x="96" y="392" width="340" height="40" rx="20" stroke-width="1.5"/>
    <text x="266" y="417"><tspan class="chipk">★ 사람이 확인하는 곳</tspan><tspan class="chipt"> — 승인 1회와 머지</tspan></text>
    <rect class="chip" x="470" y="392" width="340" height="40" rx="20" stroke-width="1.5"/>
    <text x="640" y="417"><tspan class="chipk">증거 없는 커밋</tspan><tspan class="chipt"> 은 훅이 실행 전에 차단</tspan></text>
    <rect class="chip" x="844" y="392" width="340" height="40" rx="20" stroke-width="1.5"/>
    <text x="1014" y="417"><tspan class="chipk">산출물은 파일로</tspan><tspan class="chipt"> — 끊겨도 이어 간다</tspan></text>
  </g>
</svg>
