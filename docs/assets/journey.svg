<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 256" width="1040" height="256" role="img" aria-labelledby="t d" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title id="t">devFSD 진행 순서 — 출발부터 머지까지</title>
  <desc id="d">차가 출발, 명세, 명확화, 승인, 계획, 분해, 구현, 검증, 보안·통합·성능, PR, 머지 정류장을 차례로 지난다. 승인과 머지의 차단기 앞에서는 멈추고 사람이 확인한다.</desc>
  <style>
    .bg{fill:#F2F5F8;stroke:#D5DCE4} .ink{fill:#17202B} .mut{fill:#5A6878}
